name: Publish to iOS App Store (IPA)
on:
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: "Upload to App Store Connect after building IPA"
        type: boolean
        required: true
        default: true
      submit_for_review:
        description: "After upload, wait for processing, attach the build and submit the version for App Review"
        type: boolean
        required: true
        default: true
  workflow_call:
    inputs:
      publish_to_store:
        description: "Upload to App Store Connect after building IPA"
        type: boolean
        required: false
        default: true
      submit_for_review:
        description: "After upload, wait for processing, attach the build and submit the version for App Review"
        type: boolean
        required: false
        default: true
    outputs:
      app_version:
        description: "Version from pubspec.yaml, e.g. 1.2.0"
        value: ${{ jobs.build-and-publish.outputs.app_version }}
      artifact_name:
        description: "Name of uploaded IPA artifact"
        value: ios-store-ipa
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ios
  cancel-in-progress: true

jobs:
  build-and-publish:
    # Xcode 27 preview image: the iPhone Duo reserved-region APIs (iOS 27.1 SDK)
    # are not in the macos-26 image's Xcode 26.6, so the Archive step fails to compile.
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
    env:
      # Build number is not in pubspec (it carries a bare version), and App Store
      # Connect refuses a second upload with the same CFBundleVersion for one
      # version - the run number is monotonic per workflow, which is all it needs.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/hosted
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-ios-pods-${{ hashFiles('ios/Podfile.lock', 'third_party/**') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 || secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # Automatic signing on a runner has no Xcode account, so xcodebuild
          # authenticates with this key to fetch/create the App Store profile.
          if [ -z "${ASC_API_KEY_P8:-}" ] || [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_API_KEY_P8 are required to sign an iOS build."
            exit 1
          fi
          AUTH_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$AUTH_KEY_DIR"
          AUTH_KEY_PATH="$AUTH_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8" > "$AUTH_KEY_PATH"
          echo "ASC_AUTH_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Import Apple Distribution certificate
        env:
          DIST_CERT_B64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 || secrets.MACOS_APP_STORE_CERTIFICATE_BASE64 }}
          DIST_CERT_PWD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD || secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # An Apple Distribution certificate signs iOS and macOS alike, so the
          # Mac App Store secret is reused. Without it, xcodebuild falls back to
          # cloud-managed signing, which needs an Admin-role API key.
          if [ -z "${DIST_CERT_B64:-}" ]; then
            echo "::notice::No Apple Distribution certificate secret; relying on cloud-managed signing."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build_ios.keychain"
          KEYCHAIN_PASSWORD="runner_ios_password"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$DIST_CERT_B64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${DIST_CERT_PWD:-}" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Generate iOS build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets must be configured in GitHub repository secrets."
            exit 1
          fi
          # No built-in site or support address exists in the client: without these the
          # build would ship with no invite links, no Terms/Privacy links and no sign-in bridge.
          if [ -z "$SITE_URL" ] || [ -z "$SUPPORT_EMAIL" ]; then
            echo "::error::SITE_URL and SUPPORT_EMAIL secrets must be configured in GitHub repository secrets."
            exit 1
          fi
          # --config-only bakes the version, build number and dart-defines into
          # Generated.xcconfig and runs pod install; xcodebuild does the rest so
          # it can take the API key for signing, which `flutter build ipa` can't.
          # STORE_BUILD is redundant on iOS (isAppleStoreBuild is always true
          # there) but keeps isStoreBuild honest for anything else that reads it.
          flutter build ios --release --config-only \
            --build-number="$BUILD_NUMBER" \
            --dart-define=STORE_BUILD=true \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=LIVEKIT_URL="$LIVEKIT_URL" \
            --dart-define=SITE_URL="$SITE_URL" \
            --dart-define=SUPPORT_EMAIL="$SUPPORT_EMAIL" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_AUTH_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_AUTH_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          mv "$RUNNER_TEMP"/export/*.ipa "SyncTogether-${{ steps.version.outputs.APP_VERSION }}-${BUILD_NUMBER}-iOS.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-store-ipa
          path: SyncTogether-${{ steps.version.outputs.APP_VERSION }}-${{ env.BUILD_NUMBER }}-iOS.ipa

      - name: Publish to App Store Connect
        if: ${{ inputs.publish_to_store }}
        run: |
          set -euo pipefail
          echo "UPLOAD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          xcrun altool --upload-app \
            --type ios \
            --file "SyncTogether-${{ steps.version.outputs.APP_VERSION }}-${BUILD_NUMBER}-iOS.ipa" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          echo "Uploaded build ${{ steps.version.outputs.APP_VERSION }} (${BUILD_NUMBER}); it appears in TestFlight once processing finishes."

      - name: Attach build and submit for App Review
        # The upload only lands the build in App Store Connect (TestFlight); this
        # attaches it to the iOS version and submits it, exactly as the Mac workflow does.
        if: ${{ inputs.publish_to_store && inputs.submit_for_review }}
        env:
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
          APP_ID: "6809185202"
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: |
          set -euo pipefail
          export ASC_PRIVATE_KEY_PATH="$ASC_AUTH_KEY_PATH"

          brew install rudrankriyam/tap/asc
          asc --version

          echo "==> Waiting for Apple to finish processing the build..."
          asc builds wait --app "$APP_ID" --latest --version "$APP_VERSION" --platform IOS \
            --since "$UPLOAD_STARTED_AT" --timeout 45m --poll-interval 30s --fail-on-invalid
          BUILD_ID=$(asc builds info --app "$APP_ID" --latest --version "$APP_VERSION" --platform IOS --exclude-expired \
            | jq -r '(.data.id // .data[0].id // .id)')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Could not resolve the processed build id for $APP_VERSION."
            exit 1
          fi
          echo "Build id: $BUILD_ID"

          VERSION_ID=$(asc versions list --app "$APP_ID" --platform IOS --version "$APP_VERSION" \
            | jq -r '(.data[0].id // empty)')
          if [ -z "$VERSION_ID" ]; then
            # App Store Connect allows one unreleased iOS version at a time, so a
            # build still waiting for review blocks `versions create` ("cannot create
            # a new version in the current state"). The newer build supersedes it:
            # withdraw that submission and rename its record to this version.
            STALE=$(asc versions list --app "$APP_ID" --platform IOS               --state PREPARE_FOR_SUBMISSION,WAITING_FOR_REVIEW,IN_REVIEW,REJECTED,METADATA_REJECTED,DEVELOPER_REJECTED,INVALID_BINARY               | jq -c '(.data[0] // empty) | {id, v: .attributes.versionString, s: (.attributes.appVersionState // .attributes.appStoreState)}')
            if [ -n "$STALE" ]; then
              STALE_ID=$(echo "$STALE" | jq -r .id)
              echo "==> Superseding iOS version $(echo "$STALE" | jq -r .v) ($(echo "$STALE" | jq -r .s)) with $APP_VERSION"
              # Anything not already editable is withdrawn (a no-op error if the state
              # name was unreadable and it was editable all along - the rename decides).
              if [ "$(echo "$STALE" | jq -r .s)" != "PREPARE_FOR_SUBMISSION" ]; then
                asc submit cancel --version-id "$STALE_ID" --confirm || echo "::warning::Cancel did not apply; trying the rename anyway."
              fi
              # Cancelling is asynchronous; the record is renamable once it is back
              # in PREPARE_FOR_SUBMISSION.
              for attempt in 1 2 3 4 5 6; do
                if asc versions update --version-id "$STALE_ID" --version "$APP_VERSION"; then
                  VERSION_ID="$STALE_ID"; break
                fi
                echo "==> Version not renamable yet (attempt $attempt/6) - waiting"
                sleep 20
              done
              if [ -z "$VERSION_ID" ]; then
                echo "::error::Could not rename the pending iOS version to $APP_VERSION. Check App Store Connect."
                exit 1
              fi
            fi
          fi
          if [ -z "$VERSION_ID" ]; then
            echo "==> No iOS $APP_VERSION version record yet - creating it"
            PREV=$(asc versions list --app "$APP_ID" --platform IOS --state READY_FOR_SALE --latest \
              | jq -r '(.data[0].attributes.versionString // empty)')
            if [ -n "$PREV" ]; then
              asc versions create --app "$APP_ID" --platform IOS --version "$APP_VERSION" --copy-metadata-from "$PREV"
            else
              asc versions create --app "$APP_ID" --platform IOS --version "$APP_VERSION"
            fi
            VERSION_ID=$(asc versions list --app "$APP_ID" --platform IOS --version "$APP_VERSION" | jq -r '.data[0].id')
          fi

          if [ -d "metadata/version/$APP_VERSION" ]; then
            echo "==> Pushing canonical metadata (What's New) for $APP_VERSION"
            asc metadata push --app "$APP_ID" --version "$APP_VERSION" --platform IOS --dir ./metadata
          else
            echo "::warning::metadata/version/$APP_VERSION is missing; the version keeps its copied What's New."
          fi

          # Attach before validating: validate reports "no build attached" as a
          # blocking error, which is what failed the first run of this step.
          echo "==> Attaching build $BUILD_ID to version $VERSION_ID"
          asc versions attach-build --version-id "$VERSION_ID" --build-id "$BUILD_ID"

          echo "==> Validating"
          asc validate --app "$APP_ID" --version "$APP_VERSION" --platform IOS

          echo "==> Submitting for review"
          asc review submit --app "$APP_ID" --version-id "$VERSION_ID" --build-id "$BUILD_ID" --platform IOS --confirm
          asc review status --app "$APP_ID" --platform IOS

      - name: Revoke development certificates this run created
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Automatic signing on a fresh runner has no development certificate,
          # so xcodebuild mints an "Apple Development: Created via API" one on
          # every run and never revokes it. Apple caps them, and at the cap the
          # next Archive fails with "maximum number of certificates". These are
          # disposable CI leftovers (named by the API, not by a person), so
          # revoke them here; the filter leaves every human-made certificate.
          # Best effort: a cleanup failure must never fail a build that shipped.
          export ASC_PRIVATE_KEY_PATH="${ASC_AUTH_KEY_PATH:-}"
          if [ ! -f "$ASC_PRIVATE_KEY_PATH" ]; then
            echo "::notice::No API key on disk; skipping certificate cleanup."
            exit 0
          fi
          brew install rudrankriyam/tap/asc >/dev/null 2>&1 || { echo "::warning::asc install failed; skipping certificate cleanup."; exit 0; }
          IDS=$(asc certificates list --certificate-type DEVELOPMENT --display-name "Created via API" --paginate --output json | jq -r '.data[].id') || { echo "::warning::could not list certificates."; exit 0; }
          for id in $IDS; do
            asc certificates revoke --id "$id" --confirm >/dev/null && echo "Revoked CI development certificate $id" || echo "::warning::could not revoke $id"
          done

      - name: Clean up temporary keychain and API keys
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build_ios.keychain"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf "$HOME/.appstoreconnect" || true
