name: Publish to iOS App Store (IPA)
on:
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: "Upload to App Store Connect (TestFlight) after building IPA"
        type: boolean
        required: true
        default: true
  workflow_call:
    inputs:
      publish_to_store:
        description: "Upload to App Store Connect (TestFlight) after building IPA"
        type: boolean
        required: false
        default: true
    outputs:
      app_version:
        description: "Version from pubspec.yaml, e.g. 1.2.0"
        value: ${{ jobs.build-and-publish.outputs.app_version }}
      artifact_name:
        description: "Name of uploaded IPA artifact"
        value: ios-store-ipa
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ios
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
    env:
      # Build number is not in pubspec (it carries a bare version), and App Store
      # Connect refuses a second upload with the same CFBundleVersion for one
      # version - the run number is monotonic per workflow, which is all it needs.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/hosted
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-ios-pods-${{ hashFiles('ios/Podfile.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 || secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # Automatic signing on a runner has no Xcode account, so xcodebuild
          # authenticates with this key to fetch/create the App Store profile.
          if [ -z "${ASC_API_KEY_P8:-}" ] || [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_API_KEY_P8 are required to sign an iOS build."
            exit 1
          fi
          AUTH_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$AUTH_KEY_DIR"
          AUTH_KEY_PATH="$AUTH_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8" > "$AUTH_KEY_PATH"
          echo "ASC_AUTH_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Import Apple Distribution certificate
        env:
          DIST_CERT_B64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 || secrets.MACOS_APP_STORE_CERTIFICATE_BASE64 }}
          DIST_CERT_PWD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD || secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # An Apple Distribution certificate signs iOS and macOS alike, so the
          # Mac App Store secret is reused. Without it, xcodebuild falls back to
          # cloud-managed signing, which needs an Admin-role API key.
          if [ -z "${DIST_CERT_B64:-}" ]; then
            echo "::notice::No Apple Distribution certificate secret; relying on cloud-managed signing."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build_ios.keychain"
          KEYCHAIN_PASSWORD="runner_ios_password"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$DIST_CERT_B64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${DIST_CERT_PWD:-}" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Generate iOS build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets must be configured in GitHub repository secrets."
            exit 1
          fi
          # --config-only bakes the version, build number and dart-defines into
          # Generated.xcconfig and runs pod install; xcodebuild does the rest so
          # it can take the API key for signing, which `flutter build ipa` can't.
          # STORE_BUILD is redundant on iOS (isAppleStoreBuild is always true
          # there) but keeps isStoreBuild honest for anything else that reads it.
          flutter build ios --release --config-only \
            --build-number="$BUILD_NUMBER" \
            --dart-define=STORE_BUILD=true \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=LIVEKIT_URL="$LIVEKIT_URL" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_AUTH_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_AUTH_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          mv "$RUNNER_TEMP"/export/*.ipa "SyncTogether-${{ steps.version.outputs.APP_VERSION }}-${BUILD_NUMBER}-iOS.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-store-ipa
          path: SyncTogether-${{ steps.version.outputs.APP_VERSION }}-${{ env.BUILD_NUMBER }}-iOS.ipa

      - name: Publish to App Store Connect
        if: ${{ inputs.publish_to_store }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "SyncTogether-${{ steps.version.outputs.APP_VERSION }}-${BUILD_NUMBER}-iOS.ipa" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          echo "Uploaded build ${{ steps.version.outputs.APP_VERSION }} (${BUILD_NUMBER}); it appears in TestFlight once processing finishes."

      - name: Clean up temporary keychain and API keys
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build_ios.keychain"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf "$HOME/.appstoreconnect" || true
