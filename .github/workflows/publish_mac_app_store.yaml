name: Publish to Mac App Store (PKG)
on:
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: "Submit and upload to App Store Connect after building PKG"
        type: boolean
        required: true
        default: true
  workflow_call:
    inputs:
      publish_to_store:
        description: "Submit and upload to App Store Connect after building PKG"
        type: boolean
        required: false
        default: true
    outputs:
      app_version:
        description: "Version from pubspec.yaml, e.g. 1.2.0"
        value: ${{ jobs.build-and-publish.outputs.app_version }}
      artifact_name:
        description: "Name of uploaded PKG artifact"
        value: macos-store-pkg
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-mas
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: macos-latest
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Cache Flutter build outputs
        uses: actions/cache@v4
        with:
          path: |
            build/macos
            macos/Pods
            .dart_tool
          key: ${{ runner.os }}-flutter-build-store-${{ hashFiles('**/pubspec.lock', 'macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-build-store-
            ${{ runner.os }}-flutter-build-

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Import Apple Distribution & Installer Certificates
        env:
          DIST_CERT_B64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 || secrets.MACOS_APP_STORE_CERTIFICATE_BASE64 || secrets.MACOS_CERTIFICATE_BASE64 }}
          DIST_CERT_PWD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD || secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD || secrets.MACOS_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT_B64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 || secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_CERT_PWD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD || secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DIST_CERT_B64:-}" ]; then
            echo "::warning::Apple Distribution certificate secret is not set. The package will be built unsigned."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build_mas.keychain"
          KEYCHAIN_PASSWORD="runner_mas_password"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import App signing certificate
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$DIST_CERT_B64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${DIST_CERT_PWD:-}" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$CERT_PATH"

          # Import Installer package signing certificate if present
          if [ -n "${INSTALLER_CERT_B64:-}" ]; then
            INST_CERT_PATH="$RUNNER_TEMP/inst_cert.p12"
            echo "$INSTALLER_CERT_B64" | base64 --decode > "$INST_CERT_PATH"
            security import "$INST_CERT_PATH" -k "$KEYCHAIN_PATH" -P "${INSTALLER_CERT_PWD:-}" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
            rm -f "$INST_CERT_PATH"
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Setup Provisioning Profile
        env:
          PROVISIONING_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 || secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "${PROVISIONING_PROFILE_B64:-}" ]; then
            PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILES_DIR"
            echo "$PROVISIONING_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/embedded.provisionprofile"
            cp "$RUNNER_TEMP/embedded.provisionprofile" "$PROFILES_DIR/embedded.provisionprofile"
            UUID=$(security cms -D -i "$RUNNER_TEMP/embedded.provisionprofile" 2>/dev/null | grep -aA1 'UUID' | grep -o '[-A-Za-z0-9]\{36\}' | head -n 1 || true)
            if [ -n "$UUID" ]; then
              cp "$RUNNER_TEMP/embedded.provisionprofile" "$PROFILES_DIR/${UUID}.provisionprofile"
              echo "Provisioning profile installed with UUID: $UUID"
            fi
            echo "PROVISIONING_PROFILE=$RUNNER_TEMP/embedded.provisionprofile" >> "$GITHUB_ENV"
            echo "Provisioning profile decoded successfully."
          else
            echo "::notice::No provisioning profile secret configured. If required by App Store Connect, configure APPLE_PROVISIONING_PROFILE_BASE64."
          fi

      - name: Build macOS App (Store mode)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets must be configured in GitHub repository secrets."
            exit 1
          fi
          flutter config --enable-macos-desktop
          flutter build macos --release \
            --dart-define=STORE_BUILD=true \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=LIVEKIT_URL="$LIVEKIT_URL" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST"

      - name: Package Mac App Store Installer (PKG)
        env:
          PROVISIONING_PROFILE: ${{ env.PROVISIONING_PROFILE }}
          OUTPUT_PKG: "SyncTogether-${{ steps.version.outputs.APP_VERSION }}-MacAppStore.pkg"
        run: ./scripts/package-macos-store.sh

      - name: Drop debug symbols before cache save
        run: rm -rf build/macos/Build/Products/Release/*.dSYM

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-store-pkg
          path: SyncTogether-${{ steps.version.outputs.APP_VERSION }}-MacAppStore.pkg

      - name: Publish to App Store Connect
        if: ${{ inputs.publish_to_store }}
        env:
          PKG_NAME: "SyncTogether-${{ steps.version.outputs.APP_VERSION }}-MacAppStore.pkg"
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 || secrets.ASC_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ASC_API_KEY_P8:-}" ] && [ -n "${ASC_KEY_ID:-}" ] && [ -n "${ASC_ISSUER_ID:-}" ]; then
            echo "==> Authenticating to App Store Connect via API Key ($ASC_KEY_ID)..."
            AUTH_KEY_DIR="$HOME/.appstoreconnect/private_keys"
            mkdir -p "$AUTH_KEY_DIR"
            AUTH_KEY_PATH="$AUTH_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
            echo "$ASC_API_KEY_P8" > "$AUTH_KEY_PATH"

            echo "==> Uploading $PKG_NAME to App Store Connect..."
            xcrun altool --upload-app \
              --type osx \
              --file "$PKG_NAME" \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID"
            echo "Upload to App Store Connect completed successfully!"
          elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "==> Authenticating to App Store Connect via Apple ID ($APPLE_ID)..."
            xcrun altool --upload-app \
              --type osx \
              --file "$PKG_NAME" \
              --username "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            echo "Upload to App Store Connect completed successfully!"
          else
            echo "App Store Connect credentials (APP_STORE_CONNECT_API_KEY_P8 or APPLE_APP_SPECIFIC_PASSWORD) are not configured."
            echo "Skipping automated App Store Connect upload (the .pkg artifact was built and uploaded successfully above)."
            exit 0
          fi

      - name: Clean up temporary keychain and API keys
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build_mas.keychain"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf "$HOME/.appstoreconnect" || true
