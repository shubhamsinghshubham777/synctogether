name: Publish to Microsoft Store (MSIX)
on:
  workflow_dispatch:
    inputs:
      publish_to_store:
        description: "Submit and publish to Microsoft Partner Center after building MSIX"
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      publish_to_store:
        description: "Submit and publish to Microsoft Partner Center after building MSIX"
        type: boolean
        required: false
        default: true
    outputs:
      app_version:
        description: "Version from pubspec.yaml, e.g. 1.2.0"
        value: ${{ jobs.build-and-publish.outputs.app_version }}
      artifact_name:
        description: "Name of uploaded MSIX artifact"
        value: windows-store-msix
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-msstore
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Cache Windows build outputs
        uses: actions/cache@v4
        with:
          path: build/windows
          key: ${{ runner.os }}-flutter-build-store-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-build-store-

      - name: Extract version from pubspec.yaml
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Pre-extract libwebrtc
        run: ./.github/scripts/preextract-libwebrtc.ps1

      - name: Build Windows App (Store mode)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets must be configured in GitHub repository secrets."
            exit 1
          fi
          flutter build windows --release \
            --dart-define=STORE_BUILD=true \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=LIVEKIT_URL="$LIVEKIT_URL" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST"

      - name: Create MSIX Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.APP_VERSION }}.0"
          dart run msix:create --store --build-windows false --version $version --output-name "SyncTogether-${{ steps.version.outputs.APP_VERSION }}-Store"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-msix
          path: build/windows/x64/runner/Release/SyncTogether-${{ steps.version.outputs.APP_VERSION }}-Store.msix

      - name: Setup Microsoft Store Developer CLI
        if: ${{ inputs.publish_to_store == true }}
        uses: microsoft/microsoft-store-apppublisher@v1

      - name: Configure Microsoft Store CLI
        if: ${{ inputs.publish_to_store == true }}
        env:
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID || secrets.MICROSOFT_ENTRA_TENANT_ID || secrets.AZURE_AD_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID || secrets.MICROSOFT_ENTRA_CLIENT_ID || secrets.AZURE_AD_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET || secrets.MICROSOFT_ENTRA_CLIENT_SECRET || secrets.AZURE_AD_CLIENT_SECRET }}
        shell: pwsh
        run: |
          if (-not $env:ENTRA_CLIENT_ID -or -not $env:ENTRA_TENANT_ID) {
            Write-Host "Microsoft Store credentials (ENTRA_CLIENT_ID / ENTRA_TENANT_ID) are not configured."
            Write-Host "Skipping automated Partner Center publish (the MSIX artifact was built and uploaded successfully above)."
            exit 0
          }
          msstore reconfigure `
            --tenantId "$env:ENTRA_TENANT_ID" `
            --sellerId "$env:MSSTORE_SELLER_ID" `
            --clientId "$env:ENTRA_CLIENT_ID" `
            --clientSecret "$env:ENTRA_CLIENT_SECRET"

      - name: Publish to Microsoft Partner Center
        if: ${{ inputs.publish_to_store == true }}
        env:
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID || secrets.MICROSOFT_ENTRA_CLIENT_ID || secrets.AZURE_AD_CLIENT_ID }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID || secrets.MICROSOFT_STORE_PRODUCT_ID || secrets.MSSTORE_APP_ID }}
        shell: pwsh
        run: |
          if (-not $env:ENTRA_CLIENT_ID) {
            Write-Host "Skipping publish step because credentials are not configured."
            exit 0
          }
          if (-not $env:MSSTORE_PRODUCT_ID) {
            Write-Host "::error::MSSTORE_PRODUCT_ID secret is not configured in GitHub repository secrets. Partner Center requires the Store Product ID (e.g. 9NBLGGH42THS) to identify the application when publishing loose MSIX packages."
            exit 1
          }
          $msixPath = "build/windows/x64/runner/Release/SyncTogether-${{ steps.version.outputs.APP_VERSION }}-Store.msix"
          Write-Host "Publishing $msixPath for Product ID $env:MSSTORE_PRODUCT_ID..."
          msstore publish $msixPath --appId "$env:MSSTORE_PRODUCT_ID"
