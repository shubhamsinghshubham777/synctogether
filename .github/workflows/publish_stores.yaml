name: Publish to Desktop App Stores
on:
  workflow_dispatch:
    inputs:
      publish_to_microsoft_store:
        description: "Build and submit to Microsoft Partner Center (MSIX)"
        type: boolean
        required: true
        default: true
      publish_to_mac_app_store:
        description: "Build and submit to Mac App Store Connect (PKG)"
        type: boolean
        required: true
        default: true
      publish_to_ios_app_store:
        description: "Build and upload to iOS App Store Connect (IPA)"
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      publish_to_microsoft_store:
        description: "Build and submit to Microsoft Partner Center (MSIX)"
        type: boolean
        required: false
        default: true
      publish_to_mac_app_store:
        description: "Build and submit to Mac App Store Connect (PKG)"
        type: boolean
        required: false
        default: true
      publish_to_ios_app_store:
        description: "Build and upload to iOS App Store Connect (IPA)"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-stores
  cancel-in-progress: true

jobs:
  tests:
    name: Preflight Tests
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  microsoft-store:
    name: Microsoft Store (Windows MSIX)
    needs: tests
    if: ${{ inputs.publish_to_microsoft_store }}
    uses: ./.github/workflows/publish_microsoft_store.yaml
    with:
      publish_to_store: true
    secrets: inherit

  mac-app-store:
    name: Mac App Store (macOS PKG)
    needs: tests
    if: ${{ inputs.publish_to_mac_app_store }}
    uses: ./.github/workflows/publish_mac_app_store.yaml
    with:
      publish_to_store: true
    secrets: inherit

  ios-app-store:
    name: iOS App Store (IPA)
    needs: tests
    if: ${{ inputs.publish_to_ios_app_store }}
    uses: ./.github/workflows/publish_ios_app_store.yaml
    with:
      publish_to_store: true
    secrets: inherit

  tag:
    name: Tag the built commit
    needs: [ tests, microsoft-store, mac-app-store, ios-app-store ]
    # At least one store job succeeded and none failed. `needs.*.result` cannot be
    # used here: `tests` is in it and always succeeds, which tagged runs where
    # every store was skipped.
    if: ${{ always() && needs.tests.result == 'success' && (needs.microsoft-store.result == 'success' || needs.mac-app-store.result == 'success' || needs.ios-app-store.result == 'success') && needs.microsoft-store.result != 'failure' && needs.mac-app-store.result != 'failure' && needs.ios-app-store.result != 'failure' && needs.microsoft-store.result != 'cancelled' && needs.mac-app-store.result != 'cancelled' && needs.ios-app-store.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the app version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Tag the built commit
        env:
          TAG: "v${{ steps.version.outputs.version }}"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin, leaving it alone."
          else
            # The REST API, not `git push`: a git push of a ref is refused with
            # "refusing to allow a GitHub App to create or update workflow ...
            # without `workflows` permission" whenever the pushed history touches
            # a workflow file, and GITHUB_TOKEN can never hold that permission.
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="${{ github.sha }}" >/dev/null
            echo "Tagged ${{ github.sha }} as $TAG."
          fi
      # A notes-only GitHub release (never any installers - the stores deliver the
      # app). It is what the website's /changelog reads.
      - name: Publish release notes
        env:
          TAG: "v${{ steps.version.outputs.version }}"
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone."
            exit 0
          fi
          FILE="metadata/version/$VERSION/en-US.json"
          if [ ! -f "$FILE" ]; then
            echo "::warning::$FILE is missing; skipping the GitHub release."
            exit 0
          fi
          # whatsNew is bullets ("<bullet> TITLE", newline, text) split by blank lines.
          python3 - "$FILE" > "$RUNNER_TEMP/notes.md" <<'PY'
          import json, sys
          nl = chr(10)
          out = []
          for block in json.load(open(sys.argv[1], encoding="utf-8"))["whatsNew"].split(nl * 2):
              title, _, rest = block.strip().lstrip(chr(8226)).strip().partition(nl)
              out.append("- **" + title.strip() + "**" + (": " + " ".join(rest.split()) if rest.strip() else ""))
          print((nl * 2).join(out))
          PY
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  summary:
    name: Store Release Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ tests, microsoft-store, mac-app-store, ios-app-store ]
    if: always()
    steps:
      - name: Generate Summary Report
        run: |
          echo "### Desktop App Stores Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target Store | Platform | Artifact Format | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          MS_STATUS="${{ needs.microsoft-store.result }}"
          MAS_STATUS="${{ needs.mac-app-store.result }}"

          if [ "${{ inputs.publish_to_microsoft_store }}" = "true" ]; then
            echo "| Microsoft Store | Windows (x64) | MSIX | $MS_STATUS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Microsoft Store | Windows (x64) | MSIX | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ inputs.publish_to_mac_app_store }}" = "true" ]; then
            echo "| Mac App Store | macOS (Universal/x64/arm64) | PKG (Sandboxed) | $MAS_STATUS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Mac App Store | macOS (Universal/x64/arm64) | PKG (Sandboxed) | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ inputs.publish_to_ios_app_store }}" = "true" ]; then
            echo "| iOS App Store | iOS / iPadOS | IPA | ${{ needs.ios-app-store.result }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| iOS App Store | iOS / iPadOS | IPA | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Every build ships through a store, which also delivers updates." >> $GITHUB_STEP_SUMMARY
