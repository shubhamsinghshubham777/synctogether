name: Tests
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.vscode/**'
      - 'tool/**'
      - '.github/scripts/**'
      - '.github/workflows/build_*.yaml'
      - '.github/workflows/publish_*.yaml'
      - 'website/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - '.env.example'
      - '.ghcontext'
      - '.gitignore'
      - '.metadata'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.vscode/**'
      - 'tool/**'
      - '.github/scripts/**'
      - '.github/workflows/build_*.yaml'
      - '.github/workflows/publish_*.yaml'
      - 'website/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - '.env.example'
      - '.ghcontext'
      - '.gitignore'
      - '.metadata'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pull-requests: read

# The `-tests` suffix matches the convention in the build workflows: inside a
# called workflow `github.workflow` resolves to the caller's name, so every
# concurrency group in this repo carries its own suffix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-tests
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            dart:
              - 'lib/**'
              - 'test/**'
              - 'assets/**'
              - 'pubspec.*'
              - 'analysis_options.yaml'
              - 'windows/**'
              - 'macos/**'
              - 'ios/**'
              - 'android/**'
              - 'linux/**'
            database:
              - 'supabase/**'

  dart:
    name: Analyze and test
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.dart == 'true') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump app version to '))
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pinned to the same version the installer workflows build with.
          flutter-version: '3.44.8'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/hosted
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  database:
    name: RPC suite (pgTAP)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.database == 'true') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump app version to '))
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get the Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Start the local stack
        run: supabase start

      - name: Run the RPC suite
        # Runs against a throwaway local Postgres with supabase/migrations
        # applied; each file is one transaction that rolls back, and no deployed
        # project is reachable from here.
        run: supabase test db
