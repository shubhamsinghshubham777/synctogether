name: Tests
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.codex/**'
      - '.vscode/**'
      - 'tool/**'
      - '.github/scripts/**'
      - '.github/workflows/build_*.yaml'
      - '.github/workflows/publish_*.yaml'
      - '.ghcontext'
      - '.gitignore'
      - '.metadata'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.codex/**'
      - '.vscode/**'
      - 'tool/**'
      - '.github/scripts/**'
      - '.github/workflows/build_*.yaml'
      - '.github/workflows/publish_*.yaml'
      - '.ghcontext'
      - '.gitignore'
      - '.metadata'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pull-requests: read

# The `-tests` suffix matches the convention in the build workflows: inside a
# called workflow `github.workflow` resolves to the caller's name, so every
# concurrency group in this repo carries its own suffix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-tests
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
      database: ${{ steps.filter.outputs.database }}
      website: ${{ steps.filter.outputs.website }}
      selfhost_guards: ${{ steps.filter.outputs.selfhost_guards }}
      selfhost_e2e: ${{ steps.filter.outputs.selfhost_e2e }}
      store_copy: ${{ steps.filter.outputs.store_copy }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            dart:
              - 'lib/**'
              - 'test/**'
              - 'assets/**'
              - 'pubspec.*'
              - 'third_party/**'
              - 'analysis_options.yaml'
              - 'windows/**'
              - 'macos/**'
              - 'ios/**'
              - 'android/**'
            database:
              - 'supabase/**'
            store_copy:
              - 'store/copy/**'
              - 'store/ios/*.json'
              - 'metadata/**'
              - 'scripts/store-copy.py'
            website:
              - 'website/**'
            # What a self-hoster relies on, checked statically (fast).
            selfhost_guards:
              - 'scripts/**'
              - 'docker/**'
              - 'docker-compose*.yml'
              - 'deploy/livekit/**'
              - '**/.env.example'
              - 'lib/**'
              - 'supabase/**'
              - '.github/workflows/publish_*.yaml'
            # What the verifier exercises end to end (slow): backend, website, the verifier itself.
            selfhost_e2e:
              - 'scripts/selfhost-*'
              - 'scripts/tests/**'
              - 'supabase/**'
              - 'website/package*.json'
              - 'website/next.config.ts'
              - 'website/middleware.ts'
              - 'website/lib/**'
              - 'website/app/terms/**'
              - 'website/app/privacy/**'
              - 'website/app/join/**'
              - '**/.env.example'

  dart:
    name: Analyze and test
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.dart == 'true') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump app version to '))
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pinned to the same version the installer workflows build with.
          flutter-version: '3.50.0'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/hosted
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # window_manager 0.7 compiles its native core (cnativeapi) through a build
      # hook for the host OS, and on Linux that needs GTK 3, X11 and Xi headers.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev pkg-config clang

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  database:
    name: RPC suite (pgTAP)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.database == 'true') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump app version to '))
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get the Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Start the local stack
        run: supabase start

      - name: Run the RPC suite
        # Runs against a throwaway local Postgres with supabase/migrations
        # applied; each file is one transaction that rolls back, and no deployed
        # project is reachable from here.
        run: supabase test db

  website:
    name: Website tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.website == 'true') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump app version to '))
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get Node
        uses: actions/setup-node@v4
        with:
          # The suite runs TypeScript directly under `node --test`, which needs
          # Node's built-in type stripping.
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        # Billing code without CI is how the old fail-open webhook bug shipped.
        run: npm test

      - name: Build
        # Type-checks and builds every page, so a UI change that breaks the site fails
        # here in about a minute instead of waiting on the end-to-end job. Operator
        # values are placeholders: the production build refuses to start without them.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPPORT_EMAIL: support@example.com
          NEXT_PUBLIC_COPYRIGHT_EMAIL: copyright@example.com
          NEXT_PUBLIC_OPERATOR_NAME: Example Operator
          NEXT_PUBLIC_OPERATOR_ADDRESS: 1 Example Street|Springfield|Freedonia
          NEXT_PUBLIC_GOVERNING_LAW: Freedonia
        run: npm run build

  store-copy:
    name: Store listing copy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.store_copy == 'true') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump app version to '))
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Store listings match store/copy/en-US.json and respect store limits
        run: python3 scripts/store-copy.py --check

  selfhost-guards:
    name: Self-hosting guards
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.selfhost_guards == 'true') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump app version to '))
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Verifier, config generator, compose file and .env.example drift
        # Runs the real scripts against a scratch copy of the repo layout and fails if
        # the client or the functions read a setting the .env.example files don't list,
        # if an official hostname creeps back into lib/, or if a store workflow stops
        # passing SITE_URL / SUPPORT_EMAIL.
        run: python3 -m unittest discover -s scripts/tests -v

  selfhost-e2e:
    name: Self-host verifier (end to end)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.selfhost_e2e == 'true') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump app version to '))
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get the Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Start the local stack
        # A throwaway local stack with supabase/migrations applied: the backend a
        # self-hoster ends up with, minus the cloud.
        run: supabase start

      - name: Get Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build and serve the website
        # A production build, which refuses to start without its operator values -
        # the same rule a self-hoster's build lives under.
        working-directory: website
        run: |
          eval "$(supabase status -o env | sed 's/^/export SB_/')"
          export NEXT_PUBLIC_SUPABASE_URL="$SB_API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SB_PUBLISHABLE_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SB_SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SITE_URL=http://localhost:3000 NEXT_PUBLIC_SUPPORT_EMAIL=support@example.com NEXT_PUBLIC_COPYRIGHT_EMAIL=copyright@example.com
          export NEXT_PUBLIC_OPERATOR_NAME="Example Operator" NEXT_PUBLIC_OPERATOR_ADDRESS="1 Example Street|Springfield|Freedonia" NEXT_PUBLIC_GOVERNING_LAW=Freedonia
          npm ci
          npm run build
          nohup npm run start > "$RUNNER_TEMP/website.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 2; done
          echo "::error::the website did not come up"; cat "$RUNNER_TEMP/website.log"; exit 1

      - name: Run the verifier
        # Everything it checks - schema, RLS, auth, the private Realtime channel, the
        # minute cron (about two minutes), the web pages - must pass. Exit 0 = READY.
        run: |
          eval "$(supabase status -o env | sed 's/^/export SB_/')"
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nSITE_URL=http://localhost:3000\nSUPPORT_EMAIL=support@example.com\nTURNSTILE_SITE_KEY=1x00000000000000000000AA\n' "$SB_API_URL" "$SB_PUBLISHABLE_KEY" > "$RUNNER_TEMP/client.env"
          : > "$RUNNER_TEMP/functions.env"
          SUPABASE_SERVICE_ROLE_KEY="$SB_SERVICE_ROLE_KEY" python3 scripts/selfhost-verify.py --client-env "$RUNNER_TEMP/client.env" --functions-env "$RUNNER_TEMP/functions.env"
