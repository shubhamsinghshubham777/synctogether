# Edge delivery for SyncTogether shared media. See docs/media-edge.md.
# Nothing here is deployed by CI; an operator runs `wrangler deploy`.
name = "synctogether-media-edge"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false

# The bucket is reached through a BINDING: the Worker holds no S3 credentials.
# bucket_name must equal the CF_R2_BUCKET_NAME the media-share function uses
# (the .env.example default is also synctogether-media).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "synctogether-media"

# SELF-HOSTERS: change this to a hostname on a zone in YOUR Cloudflare account
# (this one belongs to the official deployment and will not deploy for you), and
# set app_settings.media_edge.base_url to the same origin. Or remove the block and
# attach the domain in the dashboard.
[[routes]]
pattern = "media.synctogether.app"
custom_domain = true

[vars]
# Tunables (all optional; shown with their defaults).
# MAX_TTL_SECONDS = "90000"      # reject tokens whose exp is further away than this
# EDGE_CACHE_TTL_SECONDS = "21600"
# Secret, set with: wrangler secret put MEDIA_EDGE_SECRET

# Abuse limits (optional, approximate, counted per data centre). A player streaming at
# gigabit speed makes ~16 requests/s of 8 MiB chunks, so the defaults leave real headroom:
# 600 per minute per token is about 5 GB/min, 1200 per minute per IP covers a shared NAT.
# namespace_id is any integer unique on your account. Needs wrangler 4.36+.
[[ratelimits]]
name = "TOKEN_LIMITER"
namespace_id = "7001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "7002"
simple = { limit = 1200, period = 60 }

# Usage counters (requests, status, HIT/MISS, bytes) in Workers Analytics Engine.
# OFF by default: check Analytics Engine pricing before enabling (see docs/media-edge.md).
# [[analytics_engine_datasets]]
# binding = "METRICS"
# dataset = "media_edge"

# Invocation logs record the full request URL, and the URL carries the token.
# Keep this off (or add a redaction step) so signatures never reach a log sink.
[observability]
enabled = false
