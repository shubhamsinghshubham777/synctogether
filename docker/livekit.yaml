# LiveKit Server Configuration for SyncTogether Self-Hosting
# Reference: https://docs.livekit.io/home/self-hosting/deployment/

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # false suits a LAN. On a public host set true (or use scripts/setup-livekit-server.sh).
  use_external_ip: false

# API keys are NOT set here: docker-compose.selfhost.yml passes LIVEKIT_KEYS from
# LIVEKIT_API_KEY / LIVEKIT_API_SECRET, which must match supabase/functions/.env.

logging:
  json: false
  level: info
