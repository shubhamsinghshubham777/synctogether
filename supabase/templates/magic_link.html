<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>Your SyncTogether sign-in code</title>
  <!-- Booth Light (lib/ui/pt_theme.dart, website/app/globals.css): warm booth
       neutrals, Beam amber spent only on the one live action, no gradients,
       no shadows, 6px panels / 4px controls. Inline styles only - mail clients
       strip <style> and web fonts, so the Booth faces fall back to system ones. -->
</head>
<body style="margin: 0; padding: 40px 16px; background-color: #121010; font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #F4ECDF;">
  <table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 480px; background-color: #1C1917; border: 1px solid #3A332E; border-radius: 6px;">
    <tr>
      <td style="padding: 28px 32px 0 32px;">
        <span style="font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: #F4ECDF;">s<span style="color: #FFB23F;">&middot;</span>t</span>
        <span style="font-size: 13px; color: #8F8476; padding-left: 8px;">SyncTogether</span>
      </td>
    </tr>
    <tr>
      <td style="padding: 28px 32px 8px 32px;">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; color: #F4ECDF;">Your sign-in code</h1>
      </td>
    </tr>
    <tr>
      <td style="padding: 0 32px 20px 32px; font-size: 15px; line-height: 1.6; color: #C9BDAC;">
        Type this into SyncTogether to sign in:
      </td>
    </tr>
    <tr>
      <td style="padding: 0 32px 20px 32px;">
        <div style="display: inline-block; background-color: #27221F; border: 1px solid #3A332E; border-radius: 4px; padding: 14px 24px; font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #F4ECDF;">{{ .Token }}</div>
      </td>
    </tr>
    <tr>
      <td style="padding: 0 32px 28px 32px; font-size: 13px; line-height: 1.6; color: #8F8476;">
        This code expires in 1 hour. Didn't ask for it? You can safely ignore this email.
      </td>
    </tr>
    <tr>
      <td style="padding: 24px 32px 32px 32px; border-top: 1px solid #3A332E;">
        <p style="margin: 0 0 14px 0; font-size: 13px; color: #B5A999;">Or skip the typing and sign in with one click:</p>
        <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #FFB23F; color: #1A1206; border-radius: 4px; padding: 12px 22px; font-size: 14px; font-weight: 700; text-decoration: none;">Sign in to SyncTogether</a>
      </td>
    </tr>
  </table>
  <p style="max-width: 480px; margin: 16px auto 0 auto; font-size: 12px; color: #6B5F52; text-align: center;">SyncTogether &middot; synctogether.app</p>
</body>
</html>
